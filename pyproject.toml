[tool.poetry]
name = "scoped-css"
version = "0.1.0a0"
description = "Vite-shaped, attribute-scoped CSS for Django apps: colocate a stylesheet with its template, get a scoped per-page bundle."
authors = ["Network to Code, LLC <info@networktocode.com>"]
readme = "README.md"
packages = [{ include = "scoped_css" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
django = ">=4.2"
tinycss2 = ">=1.3"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-django = "*"
ruff = "*"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
# No excludes: `ruff check .` / `ruff format --check .` deliberately cover `examples/example_app`
# (migrations included) as well as the library and its tests.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
